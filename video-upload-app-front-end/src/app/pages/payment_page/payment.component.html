<main class="payment-page">
    <app-sidebar></app-sidebar>
    <app-shopping-cart></app-shopping-cart>
    <app-profile></app-profile>
    <div class="payment-container">
        <header>
            <a (click)="goToHomePage()">
                <h1>Clothes Store</h1>
            </a>
        </header>

        <div class="payment-content">
            <h2>Review Your Order</h2>
            
            <!-- Shopping Cart Summary -->
            <div class="shopping-cart-summary">
                <div class="cart-item" *ngFor="let product of productsInCart$ | async">
                    <img [src]="product.productImage" alt="{{ product.productName }}">
                    <div class="product-details">
                        <h3>{{ product.productName }}</h3>
                        <p>Price: {{ product.productPrice }}</p>
                        <p>Color: {{ product.productColor }}</p>
                        <p>Size: {{ product.productSize }}</p>

                        <!-- Quantity Selector -->
                        <div class="quantity-selector">
                            <label for="quantity">Quantity:</label>
                            <input type="number" id="quantity" name="quantity" min="1">
                        </div>
                    </div>
                    <!-- Remove Button -->
                    <button (click)="removeItemFromCart(product)" class="remove-button">Remove</button>
                </div>
            </div>
            
            <!-- Payment Method -->
            <div class="payment-method">
                <h2>Select Payment Method</h2>
                <div class="payment-options">
                    <label>
                        <input type="radio" name="paymentMethod" value="creditCard">
                        Credit Card
                    </label>
                    <label>
                        <input type="radio" name="paymentMethod" value="paypal">
                        PayPal
                    </label>
                    <label>
                        <input type="radio" name="paymentMethod" value="bankTransfer">
                        Bank Transfer
                    </label>
                </div>
            </div>
            
            <!-- Payment Button -->
            <!-- <button (click)="makePayment()" [disabled]="!selectedPaymentMethod">Complete Payment</button> -->
            <button>Complete Payment</button>
        </div>
    </div> 
</main>
