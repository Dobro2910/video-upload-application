<div (click)="onClose()" class="overlay"></div>
<div class="payment-dialog">
    <p>Please Enter The Delivery Location</p>

    <div class="location">
        <input type="text" [(ngModel)]="paymentOrder.deliveryLocation" placeholder="Input Your Delivery Location Here...">
    </div>

    <p>Please Enter Your Card Information Below</p>

    <div id="payment-form">
        <div id="card-element">
        </div>
        <div id="card-errors" role="alert"></div>
        <button id="submit-button" type="submit" (click)="handleSubmit()">Pay</button>
    </div>
</div>
