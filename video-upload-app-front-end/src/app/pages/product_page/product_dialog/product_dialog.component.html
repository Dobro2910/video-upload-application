<div (click)="onClose()" class="overlay"></div>
<div class="product-dialog">
    <div class="product-image-section">
        <img [src]="data.productImage" alt="{{ data.productName }}" />
    </div>
    <div class="product-dialog-detail">
        <h1>{{ data.productName }}</h1>
        <p>{{ data.productDescription }}</p>

        <div class="product-color-options">
            <h3>Colour and Size</h3>
            <div class="color-swatch-container">
                <div 
                    *ngFor="let colorDetail of data.productColorVarietyDetail"
                    class="color-swatch" 
                    [style.backgroundColor]="colorDetail.productColor"
                    (click)="selectColor(colorDetail)"
                >
                </div>
            </div>
        </div>

        <div class="product-size-stock-display" *ngIf="selectedColorDetails">
            <div 
                *ngFor="let size of selectedColorDetails.productSize"
                class="size-stock-swatch"
                [ngClass]="{'selected': selectedSize === size}"
                (click)="selectSize(size)"
            >{{ size }}
            </div>
        </div>

        <div class="product-info">
            <h3>Price</h3>
            <p>{{ data.productPrice | currency }}</p>
            <h3>Gender</h3>
            <p>{{ data.productGender }}</p>
            <h3>AmountSold</h3>
            <p>{{ data.productAmountSold }}</p>
        </div>
        
        <button (click)="addToCart()" mat-button class="add-to-bag">Add to Bag</button>
    </div>

    <div *ngIf="showComment" class="snack-bar">
        {{ comment }}
    </div>
</div>
