<body>
    <app-sidebar></app-sidebar>
    <app-shopping-cart></app-shopping-cart>
    <app-profile></app-profile>
    <app-seller-dashboard-icon></app-seller-dashboard-icon>

    <div class="dashboard-container">
        <header>
            <h1>Seller Dashboard</h1>
            <p>Here you can see the products that have been purchased and where to deliver them.</p>
        </header>

        <div class="dashboard-content">
            <table>
                <thead>
                    <tr>
                        <th>Order Id</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Buyer Email</th>
                        <th>Delivery Location</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loop through the orders and display the details dynamically -->
                    <tr *ngFor="let order of orders$ | async; let i = index">
                        <td>{{ order.orderId }}</td>
                        <td>{{ order.buyerEmail }}</td>
                        <td>{{ order.deliveryLocation }}</td>
                    
                        <!-- Loop through the products array in the current order -->
                        <!-- <td>
                            <table>
                                <tr *ngFor="let product of order.productId; let j = index">
                                    <td>{{ product.productName }}</td>
                                    <td>{{ product.productQuantity }}</td>
                                </tr>
                            </table>
                        </td> -->
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
