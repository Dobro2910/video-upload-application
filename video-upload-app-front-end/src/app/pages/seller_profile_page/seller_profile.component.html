<body>
  <app-sidebar></app-sidebar>
  <app-shopping-cart></app-shopping-cart>
  <app-profile></app-profile>
  <div class="seller-container">
    <div class="seller-header">
      <div class="seller-image">
        <img src="https://via.placeholder.com/150" alt="Seller Profile Picture">
      </div>
      <div class="seller-details">
        <h2 class="seller-name">Jane Doe</h2>
        <p class="seller-username">janedoe</p>
        <p class="seller-bio">Entrepreneur | Seller | Fashion Enthusiast</p>
      </div>
    </div>
  
    <div class="seller-info">
      <div class="seller-info-item">
        <h3>Email</h3>
        <p>example.com</p>
      </div>
      <div class="seller-info-item">
        <h3>Location</h3>
        <p>Los Angeles, USA</p>
      </div>
      <div class="seller-info-item">
        <h3>Store Name</h3>
        <p>Jane's Boutique</p>
      </div>
      <div class="seller-info-item">
        <h3>Joined</h3>
        <p>March 2021</p>
      </div>
      <div class="seller-info-item">
        <h3>Website</h3>
        <p><a href="https://example.com">www.janesboutique.com</a></p>
      </div>
    </div>
  
    <div class="add-product">
      <h3>Add New Product</h3>
      <form>
        <div class="form-group">
          <label for="productName">Product Name</label>
          <input type="text" id="productName" placeholder="Enter product name" required>
        </div>
        <div class="form-group">
          <label for="productPrice">Product Price</label>
          <input type="number" id="productPrice" placeholder="Enter product price" required>
        </div>
        <div class="form-group">
          <label for="productDescription">Product Description</label>
          <textarea id="productDescription" placeholder="Enter product description" required></textarea>
        </div>
        <div class="form-group">
          <label for="productImage">Product Image</label>
          <input type="file" id="productImage" required>
        </div>
        <button type="submit" class="btn add-product-btn">Add Product</button>
      </form>
    </div>
  
    <div class="seller-actions">
      <button class="btn edit-btn">Edit Profile</button>
      <button class="btn logout-btn">Logout</button>
    </div>
  </div>
</body>
